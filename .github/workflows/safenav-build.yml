name: Build SafeNav Offline Kyiv v0.3.1 stable

on:
  push:
    branches: [safenav-apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
          df -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache curl unzip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "build-tools;36.0.0"             "cmake;3.22.1"             "ndk;29.0.14206865"

      - name: Fetch Organic Maps source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/organicmaps/organicmaps.git om
          cd om
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" >> android/local.properties

      - name: Patch SafeNav privacy, branding and bundled map support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("om")

          # 1) Strong offline/privacy manifests: remove network capability from every module
          # before Android Manifest Merger runs.
          for mf in root.glob("android/**/AndroidManifest.xml"):
              ms = mf.read_text(encoding="utf-8")
              original = ms
              for perm in (
                  "android.permission.INTERNET",
                  "android.permission.ACCESS_NETWORK_STATE",
              ):
                  ms = re.sub(
                      r'\s*<uses-permission\s+android:name="' + re.escape(perm) + r'"(?:\s+[^>]*)?/?>\s*',
                      '\n',
                      ms
                  )
              if mf == root / "android/app/src/main/AndroidManifest.xml":
                  ms = ms.replace('android:allowBackup="true"', 'android:allowBackup="false"')
                  ms = ms.replace('android:backupInForeground="true"', 'android:backupInForeground="false"')
                  # Force Manifest Merger to reject network permissions supplied by external AARs.
                  removal_nodes = (
                      '\n  <uses-permission android:name="android.permission.INTERNET" tools:node="remove"/>'
                      '\n  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove"/>\n'
                  )
                  ms, n = re.subn(r'(<manifest\b[^>]*>)', r'\1' + removal_nodes, ms, count=1, flags=re.S)
                  if n != 1:
                      raise SystemExit("Could not locate opening <manifest> tag")
              if ms != original:
                  mf.write_text(ms, encoding="utf-8")

          # 1b) Organic Maps has its own APK permission whitelist. SafeNav is intentionally
          # offline, so INTERNET and ACCESS_NETWORK_STATE must not be required by that check.
          app_gradle = root / "android/app/build.gradle"
          ag = app_gradle.read_text(encoding="utf-8")
          ag = ag.replace('    "name=\'android.permission.INTERNET\'",\n', '')
          ag = ag.replace('    "name=\'android.permission.ACCESS_NETWORK_STATE\'",\n', '')
          app_gradle.write_text(ag, encoding="utf-8")

          # 1c) SafeNav is deliberately offline. Organic Maps still queries
          # ConnectivityManager during native initialization. Without
          # ACCESS_NETWORK_STATE Android throws SecurityException before the map UI starts.
          # Patch ConnectionState so SafeNav always reports "no network" and never calls
          # ConnectivityManager.
          cs = root / "android/sdk/src/main/java/app/organicmaps/sdk/util/ConnectionState.java"
          if not cs.exists():
              candidates = list(root.glob("android/**/ConnectionState.java"))
              if not candidates:
                  raise SystemExit("ConnectionState.java not found")
              cs = candidates[0]
          cst = cs.read_text(encoding="utf-8")
          cst = re.sub(
              r'public\s+static\s+boolean\s+isNetworkConnected\s*\(\s*\)\s*\{.*?\n\s*\}',
              'public static boolean isNetworkConnected() { return false; }',
              cst, count=1, flags=re.S
          )
          cst = re.sub(
              r'public\s+static\s+int\s+getConnectionState\s*\(\s*\)\s*\{.*?\n\s*\}',
              'public static int getConnectionState() { return CONNECTION_NONE; }',
              cst, count=1, flags=re.S
          )
          # requestCurrentType is the path shown by the Xiaomi crash stack.
          cst = re.sub(
              r'(?:public|private)\s+static\s+[^\s]+\s+requestCurrentType\s*\(\s*\)\s*\{.*?\n\s*\}',
              'private static int requestCurrentType() { return CONNECTION_NONE; }',
              cst, count=1, flags=re.S
          )
          cs.write_text(cst, encoding="utf-8")

          # 2) Give the sideload build its own application id.
          gradle = root / "android/app/build.gradle"
          s = gradle.read_text(encoding="utf-8")
          # Organic Maps' own APK permission verifier treats network permissions as mandatory.
          # SafeNav intentionally removes them, so remove the same two entries from its whitelist.
          s = s.replace("    \"name='android.permission.INTERNET'\",\n", "")
          s = s.replace("    \"name='android.permission.ACCESS_NETWORK_STATE'\",\n", "")
          marker = "defaultConfig {"
          p = s.find(marker)
          if p < 0:
              raise SystemExit("defaultConfig not found")
          insert_at = p + len(marker)
          s = s[:insert_at] + "\n    applicationId 'app.safenav.offline'\n" + s[insert_at:]
          gradle.write_text(s, encoding="utf-8")

          # 3) Brand visible app name while keeping Organic Maps attribution/About pages.
          for path in root.glob("android/app/src/main/res/values*/strings.xml"):
              txt = path.read_text(encoding="utf-8")
              txt2 = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                            r'\1SafeNav Offline Kyiv\2', txt, count=1, flags=re.S)
              if txt2 != txt:
                  path.write_text(txt2, encoding="utf-8")

          # 4) Keep Organic Maps' normal LocalCountryFile lifecycle.
          # Bundled maps are packaged as assets and installed into the writable maps
          # directory by the app's existing resource/copy path rather than being exposed
          # as zero-directory APK-backed LocalCountryFile objects. The previous direct
          # registration was the source of the startup crash on Xiaomi.
          cpp = root / "libs/platform/local_country_file_utils.cpp"
          # No native LocalCountryFile injection in this build.
          PY

      - name: Prepare stable offline build
        run: |
          cd om
          # First priority: a clean, launchable navigator. Do not inject MWM files
          # into APK assets; Organic Maps does not support arbitrary asset injection
          # as installed local maps and the previous approach crashed on-device.
          echo "Building clean SafeNav shell without unsupported map injection"

      - name: Build arm64 APK
        working-directory: om/android
        env:
          CI: "true"
        run: |
          ./gradlew --no-daemon --stacktrace -Parm64 -Pnjobs=2 -Pfirebase=false :app:assembleFdroidProfileable

      - name: Collect and verify APK
        run: |
          APK="$(find om/android/app/build/outputs/apk -type f -name '*.apk' | grep -i 'fdroid' | grep -i 'profileable' | head -1)"
          test -n "$APK"
          cp "$APK" SafeNav-Offline-Kyiv-v0.3.1.apk

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump permissions SafeNav-Offline-Kyiv-v0.3.1.apk | tee permissions.txt

          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission found"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" permissions.txt; then
            echo "ERROR: ACCESS_NETWORK_STATE permission found"
            exit 1
          fi

          sha256sum SafeNav-Offline-Kyiv-v0.3.1.apk | tee SafeNav-Offline-Kyiv-v0.3.1.sha256
          ls -lh SafeNav-Offline-Kyiv-v0.3.1.apk
          df -h

      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete safenav-offline-kyiv-v0.3.1 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create safenav-offline-kyiv-v0.3.1 \
            SafeNav-Offline-Kyiv-v0.3.1.apk \
            SafeNav-Offline-Kyiv-v0.3.1.sha256 \
            permissions.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SafeNav Offline Kyiv v0.3.1" \
            --notes "Stable SafeNav launcher build. Unsupported direct MWM asset injection was removed after on-device Xiaomi crash testing. INTERNET and ACCESS_NETWORK_STATE permissions remain absent."

      - uses: actions/upload-artifact@v4
        with:
          name: SafeNav-Offline-Kyiv-v0.3.1
          path: |
            SafeNav-Offline-Kyiv-v0.3.1.apk
            SafeNav-Offline-Kyiv-v0.3.1.sha256
            permissions.txt
          compression-level: 0
          if-no-files-found: error
