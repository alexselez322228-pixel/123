name: Build SafeNav Hybrid Kyiv v0.4.0 stable

on:
  push:
    branches: [safenav-apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
          df -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache curl unzip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "build-tools;36.0.0"             "cmake;3.22.1"             "ndk;29.0.14206865"

      - name: Fetch Organic Maps source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/organicmaps/organicmaps.git om
          cd om
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" >> android/local.properties

      - name: Patch SafeNav privacy, branding and bundled map support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("om")

          # 1) Hybrid mode: keep Organic Maps network permissions for map downloads.

          # 1b) Keep the upstream permission whitelist.

          # 1c) Keep upstream ConnectionState so online map downloads work.

          # 2) Give the sideload build its own application id.
          gradle = root / "android/app/build.gradle"
          s = gradle.read_text(encoding="utf-8")
          marker = "defaultConfig {"
          p = s.find(marker)
          if p < 0:
              raise SystemExit("defaultConfig not found")
          insert_at = p + len(marker)
          s = s[:insert_at] + "\n    applicationId 'app.safenav.offline'\n" + s[insert_at:]
          gradle.write_text(s, encoding="utf-8")

          # 3) Brand visible app name while keeping Organic Maps attribution/About pages.
          for path in root.glob("android/app/src/main/res/values*/strings.xml"):
              txt = path.read_text(encoding="utf-8")
              txt2 = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                            r'\1SafeNav Offline Kyiv\2', txt, count=1, flags=re.S)
              if txt2 != txt:
                  path.write_text(txt2, encoding="utf-8")

          # 4) Keep Organic Maps' normal LocalCountryFile lifecycle.
          # Bundled maps are packaged as assets and installed into the writable maps
          # directory by the app's existing resource/copy path rather than being exposed
          # as zero-directory APK-backed LocalCountryFile objects. The previous direct
          # registration was the source of the startup crash on Xiaomi.
          cpp = root / "libs/platform/local_country_file_utils.cpp"
          # No native LocalCountryFile injection in this build.
          PY

      - name: Prepare hybrid map build
        run: |
          echo "Online map downloads enabled; navigation/routing remains local after maps are downloaded."
      - name: Build arm64 APK
        working-directory: om/android
        env:
          CI: "true"
        run: |
          ./gradlew --no-daemon --stacktrace -Parm64 -Pnjobs=2 -Pfirebase=false :app:assembleFdroidProfileable

      - name: Collect and verify APK
        run: |
          APK="$(find om/android/app/build/outputs/apk -type f -name '*.apk' | grep -i 'fdroid' | grep -i 'profileable' | head -1)"
          test -n "$APK"
          cp "$APK" SafeNav-Offline-Kyiv-v0.4.0.apk

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump permissions SafeNav-Offline-Kyiv-v0.4.0.apk | tee permissions.txt

          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission found"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" permissions.txt; then
            echo "ERROR: ACCESS_NETWORK_STATE permission found"
            exit 1
          fi

          sha256sum SafeNav-Offline-Kyiv-v0.4.0.apk | tee SafeNav-Offline-Kyiv-v0.4.0.sha256
          ls -lh SafeNav-Offline-Kyiv-v0.4.0.apk
          df -h

      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete safenav-offline-kyiv-v0.4.0 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create safenav-offline-kyiv-v0.4.0 \
            SafeNav-Offline-Kyiv-v0.4.0.apk \
            SafeNav-Offline-Kyiv-v0.4.0.sha256 \
            permissions.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SafeNav Offline Kyiv v0.4.0" \
            --notes "Hybrid SafeNav: maps are downloaded online on demand; routing/navigation uses downloaded local map data. This keeps the APK small enough for direct chat delivery."

      - uses: actions/upload-artifact@v4
        with:
          name: SafeNav-Offline-Kyiv-v0.4.0
          path: |
            SafeNav-Offline-Kyiv-v0.4.0.apk
            SafeNav-Offline-Kyiv-v0.4.0.sha256
            permissions.txt
          compression-level: 0
          if-no-files-found: error
