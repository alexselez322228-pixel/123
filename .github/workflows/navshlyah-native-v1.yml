name: Build NavShlyah UA Native v1.0

on:
  push:
    branches: [main]
    paths:
      - 'navshlyah_native/**'
      - '.github/workflows/navshlyah-native-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install map tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool curl
          python3 --version
          osmium --version

      - name: Build Kyiv and Kyiv Oblast road graph
        run: |
          mkdir -p mapbuild navshlyah_native/app/src/main/assets
          curl -fL --retry 3 --retry-delay 3             -o mapbuild/ukraine.osm.pbf             https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          osmium extract -b 29.0,49.7,32.3,51.8             --strategy=complete_ways             mapbuild/ukraine.osm.pbf -o mapbuild/kyiv.osm.pbf --overwrite
          osmium tags-filter mapbuild/kyiv.osm.pbf             w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,service,living_street             -o mapbuild/roads.osm.pbf --overwrite
          osmium export mapbuild/roads.osm.pbf -f geojsonseq             -o mapbuild/roads.geojsonseq --overwrite
          python3 navshlyah_native/tools/build_graph.py             mapbuild/roads.geojsonseq             navshlyah_native/app/src/main/assets/roads.bin
          ls -lh navshlyah_native/app/src/main/assets/roads.bin
          rm -rf mapbuild

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle -p navshlyah_native --no-daemon :app:assembleRelease

      - name: Verify APK is offline
        run: |
          APK=navshlyah_native/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "INTERNET permission found"; exit 1
          fi
          cp "$APK" NavShlyah-UA-Native-v1.0.apk
          sha256sum NavShlyah-UA-Native-v1.0.apk | tee NavShlyah-UA-Native-v1.0.sha256
          ls -lh NavShlyah-UA-Native-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NavShlyah-UA-Native-v1.0
          path: |
            NavShlyah-UA-Native-v1.0.apk
            NavShlyah-UA-Native-v1.0.sha256
            permissions.txt
          compression-level: 0
          if-no-files-found: error
