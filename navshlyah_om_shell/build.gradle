plugins { id 'com.android.application' }

android {
  namespace 'ua.navshlyah.app'
  compileSdk 36

  defaultConfig {
    applicationId 'ua.navshlyah.app'
    minSdk 26
    targetSdk 35
    versionCode 12
    versionName '1.2.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }
}

dependencies {
  implementation project(':sdk')
}
