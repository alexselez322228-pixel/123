plugins { id 'com.android.application' }

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"

android {
  namespace 'ua.navshlyah.app'

  defaultConfig {
    applicationId 'ua.navshlyah.app'
    versionCode 18
    versionName '1.8.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }

  androidResources {
    ignoreAssetsPattern = '!.svn:!.git:!.DS_Store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
    // MWM files are random-access vector databases. If compressed in the APK,
    // startup can stall while Android inflates ~100+ MB. Keep them stored.
    noCompress = ['png', 'mwm', 'ttf', 'packed_polygons.bin']
  }

  compileOptions {
    coreLibraryDesugaringEnabled = true
  }
}

dependencies {
  implementation project(':sdk')
  coreLibraryDesugaring libs.android.tools.desugaring
}
